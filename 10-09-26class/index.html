<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
</head>

<body>

    <h1>Lista de estudiantes</h1>
    Nombre:
    <input type="text" id="nombre" placeholder="Ingresar su nombre">
    <br><br>
    Apellido:
    <input type="text" id="apellido" placeholder="Ingresar su apellido">
    <br><br>
    Fecha de nacimiento:
    <input type="date" id="fecha" placeholder="Ingresar su fecha de nacimiento">
    <br><br>
    <button onclick="agregarTareas()">Adicionar estudiante</button>
    <button onclick="eliminarTareas()">Borrar estudiante</button>
    <br><br>
    <p id="respuesta"></p>
    <script src="./js/mieScrip.js"></script>
</body>
</html>
