<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>suma</h1>
    <input type="number" id="num1" placeholder="Ingrese un número">
    <input type="number" id="num2" placeholder="Ingrese otro número">
    <button onclick="sumar()">Sumar</button>
    <p id="resultado"></p>
    <script>
        function sumar() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var resultado = parseFloat(num1) + parseFloat(num2);
            document.getElementById("resultado").innerText = "El resultado de la suma es: " + resultado;
        }
    </script>
    <script src="ejemplo1.js"></script>
</body>
</html>
